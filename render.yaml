# LOOPMESH deployment blueprint for Render.
#
# Topology: one public web service (Next.js frontend + same-origin API proxy),
# one private service (FastAPI, unreachable from the internet) and one
# PostgreSQL instance in the same region.
#
# The browser only ever talks to the web service; the Next.js route handlers
# proxy /api/v1/* to the private service over Render's internal network. The
# API therefore needs no public URL, no cross-site CORS credentials and no
# exposed OpenAPI surface.
#
# Values marked `sync: false` are deployment secrets or deployment-specific
# hostnames. Set them in the Render dashboard (Environment tab); the blueprint
# never carries them. See docs/DEPLOYMENT_RENDER.md before the first deploy.

services:
  - type: web
    name: loopmesh-web
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # `next start` binds $PORT when Render sets it and falls back to 3000
    # locally, so no port is hardcoded here.
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Bare `host:port`, e.g. loopmesh-api:8000. The frontend adds the scheme
      # when it is missing (lib/api-base.ts).
      - key: API_INTERNAL_URL
        fromService:
          type: pserv
          name: loopmesh-api
          property: hostport
      # Deliberately NOT set: NEXT_PUBLIC_API_URL is inlined into the browser
      # bundle and would point the browser straight at the API.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  - type: pserv
    name: loopmesh-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Migrations run before the new instance receives traffic. If the plan does
    # not offer pre-deploy commands, drop this line and run
    # `alembic upgrade head` once from the service shell instead.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      # Render issues `postgresql://…`; the application rewrites the scheme to
      # the installed psycopg 3 driver (app/core/config.py).
      - key: DATABASE_URL
        fromDatabase:
          name: loopmesh-db
          property: connectionString
      # Deployment-specific: the private hostname plus the public frontend host
      # (no scheme, no port, no wildcard).
      - key: ALLOWED_HOSTS
        sync: false
      # Deployment-specific: the single public https origin of loopmesh-web.
      - key: CORS_ORIGINS
        sync: false
      # Fernet key for platform TOTP secrets. Generate once, store only here.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      # Leave disabled: the frontend proxy is the only client, and client IPs
      # are not forwarded through it.
      - key: TRUST_PROXY_HEADERS
        value: "false"

databases:
  - name: loopmesh-db
    databaseName: loopmesh
    plan: basic-256mb
    postgresMajorVersion: "17"
